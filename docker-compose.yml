# ==============================================================================
# Architecture Docker Compose Multi-Services
# Module I347 - Virtualisation d'une application avec conteneurs
# Projet : CloudAsset Manager | Binôme : Kodjo & Selle | Sujet 10
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. SERVICE FRONTEND & REVERSE PROXY (Nginx Alpine)
  # ----------------------------------------------------------------------------
  frontend:
    image: nginx:1.27-alpine
    container_name: i347-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/src:/usr/share/nginx/html:ro
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 2. SERVICE BACKEND API (Flask Multi-Stage & Sécurisé non-root)
  # Image taguée pour publication Docker Hub (Sujet 10)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-keyshi9}/${DOCKERHUB_IMAGE_NAME:-i347-flask-inventory-api}:${DOCKERHUB_TAG:-1.0.0}
    container_name: i347-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-inventory_db}
      - POSTGRES_USER=${POSTGRES_USER:-appuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_postgres_pass_2026}
      - FLASK_PORT=5000
      - FLASK_ENV=${FLASK_ENV:-production}
      - APP_VERSION=${APP_VERSION:-1.0.0}
    # Sécurité réseau : pas d'exposition de port direct sur l'hôte, accessible uniquement via Nginx
    networks:
      - frontend-net
      - backend-net
    depends_on:
      database:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. SERVICE BASE DE DONNÉES (PostgreSQL 16 avec Volume Persistant)
  # ----------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: i347-database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Persistance garantie des données au redémarrage / recréation
      - postgres_data:/var/lib/postgresql/data
      # Script d'initialisation automatique au premier démarrage
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Sécurité maximale : réseau backend-net isolé, aucun port exposé sur la machine hôte
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # SERVICE BONUS : ADMINER (Outil d'administration Web de la BDD pour la Démo)
  # Activé avec le profil 'admin' : docker compose --profile admin up -d
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: i347-adminer
    restart: unless-stopped
    profiles:
      - admin
    ports:
      - "8081:8080"
    networks:
      - backend-net
    depends_on:
      database:
        condition: service_healthy

# ------------------------------------------------------------------------------
# VOLUMES DOCKER (Persistance des données)
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: i347_postgres_data
    driver: local

# ------------------------------------------------------------------------------
# RÉSEAUX DOCKER PERSONNALISÉS (Isolation de sécurité)
# ------------------------------------------------------------------------------
networks:
  # Réseau externe reliant le Reverse Proxy Nginx et le Backend
  frontend-net:
    name: i347_frontend_net
    driver: bridge

  # Réseau interne isolé reliant le Backend et la BDD (inaccessible depuis Nginx/Web)
  backend-net:
    name: i347_backend_net
    driver: bridge
